name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: Validate contracts and generated output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm check:drift
      - run: pnpm typecheck
      - run: pnpm test
