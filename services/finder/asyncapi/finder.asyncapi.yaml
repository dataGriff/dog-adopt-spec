asyncapi: 3.0.0
info:
  title: Finder events
  version: 1.0.0
  description: >
    Messages the finder places on its own Cloudflare Queue, as CloudEvents
    1.0 structured envelopes. The capture step (scheduled or manual) parses a
    rescue site and sends one snapshot.captured message per rescue; the
    queue consumer posts the snapshot to the Dogs API ingest endpoint using
    the envelope id as the Idempotency-Key, so a redelivered message cannot
    double-apply. Adapter failures are reported on a second channel so they
    can be seen without a dashboard.
  contact:
    name: dogadopt
    url: https://github.com/dataGriff/dog-adopt-spec
  tags:
    - name: finder

defaultContentType: application/cloudevents+json

servers:
  cloudflareQueues:
    host: queues.cloudflare.com
    protocol: cloudflare-queues
    description: Cloudflare Queue named dogadopt-finder-snapshots.

channels:
  snapshotCaptured:
    address: finder.snapshot.captured.v1
    messages:
      SnapshotCaptured:
        $ref: '#/components/messages/SnapshotCaptured'
  adapterFailed:
    address: finder.adapter.failed.v1
    messages:
      AdapterFailed:
        $ref: '#/components/messages/AdapterFailed'

operations:
  publishSnapshotCaptured:
    action: send
    description: Sent once per rescue per capture run after the adapter has parsed the site.
    channel:
      $ref: '#/channels/snapshotCaptured'
    messages:
      - $ref: '#/channels/snapshotCaptured/messages/SnapshotCaptured'
  consumeSnapshotCaptured:
    action: receive
    description: >
      The finder's own queue consumer. Posts data.snapshot to
      ingestRescueSnapshot for data.rescueId with Idempotency-Key set to the
      envelope id. Retries on 5xx and network errors; acks on 2xx, 4xx other
      than 429, and after the retry budget is spent.
    channel:
      $ref: '#/channels/snapshotCaptured'
    messages:
      - $ref: '#/channels/snapshotCaptured/messages/SnapshotCaptured'
  publishAdapterFailed:
    action: send
    description: Sent when an adapter throws or returns nothing parseable.
    channel:
      $ref: '#/channels/adapterFailed'
    messages:
      - $ref: '#/channels/adapterFailed/messages/AdapterFailed'

components:
  schemas:
    Envelope:
      type: object
      required: [specversion, id, source, type, subject, time, datacontenttype, data]
      properties:
        specversion: { type: string, const: '1.0' }
        id: { type: string, format: uuid, description: Also used as the ingest Idempotency-Key. }
        source: { type: string, const: /finder }
        type: { type: string }
        subject: { type: string, description: The rescue id. }
        time: { type: string, format: date-time }
        datacontenttype: { type: string, const: application/json }
    FoundDog:
      $ref: '../../dogs-api/openapi/dogs-api.openapi.yaml#/components/schemas/FoundDog'
    RescueSnapshot:
      $ref: '../../dogs-api/openapi/dogs-api.openapi.yaml#/components/schemas/RescueSnapshot'

  messages:
    SnapshotCaptured:
      name: SnapshotCaptured
      title: Rescue snapshot captured
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { type: string, const: uk.co.dogadopt.finder.snapshot.captured.v1 }
              subject: { type: string, format: uuid }
              data:
                type: object
                required: [rescueId, snapshot]
                additionalProperties: false
                properties:
                  rescueId: { type: string, format: uuid }
                  snapshot:
                    $ref: '#/components/schemas/RescueSnapshot'
      examples:
        - name: cardiff-fixture
          payload:
            specversion: '1.0'
            id: 9d8c7b6a-5f4e-4d3c-8b2a-1f0e9d8c7b6a
            source: /finder
            type: uk.co.dogadopt.finder.snapshot.captured.v1
            subject: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
            time: '2026-10-19T08:00:00Z'
            datacontenttype: application/json
            data:
              rescueId: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
              snapshot:
                capturedAt: '2026-10-19T08:00:00Z'
                source:
                  adapter: cardiff-dogs-home
                  url: https://www.cardiffdogshome.co.uk/give-a-dog-a-home/dogs-available-for-rehoming/
                  mode: fixture
                  adapterVersion: '1.0.0'
                complete: true
                dogs:
                  - externalId: bella-2
                    name: Bella
                    status: available
                    age: Adult
                    size: Medium
                    gender: Female
                    breeds: [Staffie]
                    goodWithKids: true
                    goodWithDogs: null
                    goodWithCats: false
                    profileUrl: https://www.cardiffdogshome.co.uk/dog/bella-2/
                    imageUrl: null
                    birthYear: 2021
                    birthMonth: null
                    birthDay: null
                    rescueSinceDate: null
    AdapterFailed:
      name: AdapterFailed
      title: Adapter failed
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { type: string, const: uk.co.dogadopt.finder.adapter.failed.v1 }
              data:
                type: object
                required: [rescueId, adapter, mode, message]
                additionalProperties: false
                properties:
                  rescueId: { type: string, format: uuid }
                  adapter: { type: string }
                  mode: { type: string, enum: [live, fixture] }
                  url: { type: string, format: uri }
                  message: { type: string, maxLength: 2000 }
